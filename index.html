function nearest(){if(!p||boss)return null;const candidates=[...npcs,...props,...roomInfo().doors,{kind:'rest',x:155,y:F,label:'Reacender · vida, ecos e frascos'}].filter(o=>!(o.kind==='end'&&!data.final));return candidates.filter(o=>Math.abs(p.x-o.x)<74&&Math.abs(p.y-o.y)<82).sort((a,b)=>dist(p,a)-dist(p,b))[0]||null}

 if(o.kind==='rest'){p.hp=data.life;p.mana=currentMaxMana();p.pots=data.flask?data.potMax:0;particle(p.x,p.y-30,'#b5ecd1',25);save();return toast('Lanterna reacendida · progresso salvo')}

 if(o.kind==='valve'){if(data.valves.includes(o.id))return toast('Esta válvula já está aberta.');if(o.id==='return'&&!data.valves.includes('intake'))return toast('A pressão resiste. Abra a válvula Entrada primeiro, à esquerda.');data.valves.push(o.id);ring(o.x,F-40,'#d2b88c');save();return toast('Válvula '+(o.id==='intake'?'Entrada':'Retorno')+' aberta · '+data.valves.length+'/2')}

function ending(){panel('Aster · O último guardião','Eu parei a queima. Guardei os nomes. Quando o conselho exigiu que eu reacendesse a máquina, fechei os olhos de todos.\n\nNima: “Você salvou o que lembravam. E quem eles poderiam se tornar?”\n\nAster baixa a lança. “Eu não sabia como devolver uma cidade a uma dor que eu conhecia. Talvez você também não saiba. Mas agora a escolha é sua.”'+(flags().oru===2?'\n\nAs páginas de Oru confirmam: havia outra saída. Alva poderia ter aprendido a viver com menos luz.':''),[['Devolver as memórias',()=>finish('amanhecer')],['Preservar o sono',()=>finish('vigilia')],['Ainda quero ouvir os habitantes',resume]],'dialogue')}

function cast(){if(!data.spell)return toast('Oru ensina o Orbe no Arquivo, acessível pelo Abrigo.');if(p.spellcd>0||p.shield||p.stun>0)return;if(p.mana<25)return toast('O Orbe precisa de 25 ecos. Acerte ou derrote inimigos.');const up=held.has('aimUp')||held.has('upAttack');p.mana-=25;p.spell=.4;p.spellcd=.62;p.spellUp=up;const x=p.x+(up?0:p.dir*25),y=p.y-(up?68:35);shots.push({x,y,vx:up?0:p.dir*560,vy:up?-560:0,owner:'hero',kind:'energy',r:11,damage:8+data.power*2,life:2.2,id:++serial});ring(x,y,'#c0efff',38);particle(x,y,'#9ae0f5',12);audioEngine.fx('spell')}

function draw(){const d=Math.min(2,window.devicePixelRatio||1),cw=c.width/d,ch=c.height/d;g.setTransform(d,0,0,d,0,0);const fill=g.createLinearGradient(0,0,0,ch);fill.addColorStop(0,palettes[roomInfo().theme][0]);fill.addColorStop(1,palettes[roomInfo().theme][1]);g.fillStyle=fill;g.fillRect(0,0,cw,ch);g.save();g.translate(0,offsetY);g.scale(scale,scale);if(!bgCache||bgTheme!==roomInfo().theme)makeBackground();const off=Math.max(0,(view-worldW())/2);g.drawImage(bgCache,off-camera*.20,0);

 if(boss){for(const x of [boss.arenaLeft-10,boss.arenaRight+10]){rect(x-3,120,6,F-120,'#e7c0843b');for(let j=0;j<11;j++){const yy=135+j*29+Math.sin(clock*3+j)*3;path([[x-8,yy],[x,yy-7],[x+8,yy],[x,yy+7]],'#ebd2a660')}}}

 if(p)drawNima();else{lantern(worldW()*.53,F,1.65)}

 for(const s of sparks){g.globalAlpha=Math.min(1,s.life*2);rect(s.x,s.y,3,3,s.color)}g.globalAlpha=1;g.restore();
 for(let i=0;i<35;i++){const xx=(i*173+clock*(roomInfo().theme==='forge'?13:6))%(view+80)-40,yy=(i*77+Math.sin(clock*.7+i)*10)%420;if(roomInfo().theme==='bell'||roomInfo().theme==='marsh')line(xx,yy,xx-3,yy+9,pal[3]+'20',1);else ellipse(xx,yy,1.2,1.2,pal[3]+'66')}
 const fog=g.createLinearGradient(0,450,0,540);fog.addColorStop(0,'#07191d00');fog.addColorStop(1,'#07191deb');g.fillStyle=fog;g.fillRect(0,450,view,90);g.restore();
}

const baseLayout={portrait:{left:[.085,.74],right:[.235,.74],upAttack:[.41,.245],shield:[.585,.245],spell:[.755,.245],heal:[.93,.245],dash:[.425,.74],jump:[.67,.74],attack:[.91,.74]},landscape:{left:[.055,.71],right:[.135,.71],upAttack:[.70,.255],shield:[.79,.255],spell:[.88,.255],heal:[.965,.255],dash:[.73,.755],jump:[.84,.755],attack:[.95,.755]}};
function controlMetrics(){const board=$('controls'),css=getComputedStyle(board),left=parseFloat(css.paddingLeft)||0,right=parseFloat(css.paddingRight)||0,bottom=parseFloat(css.paddingBottom)||0;return{left,width:board.clientWidth-left-right,height:board.clientHeight-bottom}}
function layoutControls(){const m=controlMetrics(),w=m.width,h=m.height,ori=orientation();for(const b of document.querySelectorAll('.pad')){const saved=settings.layouts[ori]?.[b.dataset.key],xy=saved||baseLayout[ori][b.dataset.key],radius=(parseFloat(getComputedStyle(b).width)||54)/2+4;const x=m.left+clamp(Number(xy[0])*w,radius,w-radius),y=clamp(Number(xy[1])*h,radius,h-radius);b.style.left=x+'px';b.style.top=y+'px'}}
function editLayout(){remapping=null;layoutBefore=copy(settings.layouts);mode='layout';resetInput();$('panel').hidden=true;$('controls').removeAttribute('inert');$('layoutbar').hidden=false;document.body.classList.add('editing');$('layoutbar').querySelector('span').textContent='Arraste os botões. Esta orientação tem seu próprio layout.';layoutControls()}
function finishLayout(saveIt){if(saveIt){const nodes=[...document.querySelectorAll('.pad')];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i].getBoundingClientRect(),b=nodes[j].getBoundingClientRect();if(Math.hypot(a.x+a.width/2-b.x-b.width/2,a.y+a.height/2-b.y-b.height/2)<(a.width+b.width)*.42){$('layoutbar').querySelector('span').textContent='Há botões sobrepostos. Separe-os antes de salvar.';return}}saveSettings()}else if(layoutBefore){settings.layouts=copy(layoutBefore);layoutControls()}document.body.classList.remove('editing');$('layoutbar').hidden=true;settingsMenu()}
const dragging=new Map();
function actionsFor(code){return Object.keys(settings.keys).filter(action=>settings.keys[action].includes(code))}
function release(action){if(!action)return;if(![...touch.values()].includes(action)&&![...keyHeld].some(code=>settings.keys[action].includes(code)))held.delete(action)}
document.querySelectorAll('.pad').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();audioEngine.unlock();if(mode==='layout'){const r=b.getBoundingClientRect();dragging.set(e.pointerId,{button:b,dx:e.clientX-r.x-r.width/2,dy:e.clientY-r.y-r.height/2});b.setPointerCapture(e.pointerId);return}if(mode!=='play')return;touch.set(e.pointerId,b.dataset.key);b.setPointerCapture(e.pointerId);b.classList.add('pressed');press(b.dataset.key)});
 b.addEventListener('pointermove',e=>{if(mode!=='layout')return;const drag=dragging.get(e.pointerId);if(!drag)return;const board=$('controls').getBoundingClientRect(),m=controlMetrics(),radius=b.getBoundingClientRect().width/2+4,xx=clamp(e.clientX-board.x-m.left-drag.dx,radius,m.width-radius),yy=clamp(e.clientY-board.y-drag.dy,radius,m.height-radius);settings.layouts[orientation()][b.dataset.key]=[xx/m.width,yy/m.height];layoutControls()});
 const up=e=>{dragging.delete(e.pointerId);const k=touch.get(e.pointerId);touch.delete(e.pointerId);release(k);if(![...touch.values()].includes(b.dataset.key))b.classList.remove('pressed')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
window.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(remapping){e.preventDefault();if(e.code==='Escape'){remapping=null;settingsMenu();return}if(['Tab','CapsLock','NumLock','ScrollLock'].includes(e.code)&&e.code!=='Tab')return;if(e.code==='Escape'&&remapping!=='pause')return;const clash=Object.keys(settings.keys).find(k=>k!==remapping&&settings.keys[k].includes(e.code));if(clash){const b=document.querySelector('[data-remap="'+remapping+'"]');if(b)b.textContent='Em uso: '+actionNames[clash];return}settings.keys[remapping]=[e.code];saveSettings();remapping=null;settingsMenu();return}
 if(mode!=='play'){if(e.code==='Escape'){if(mode==='layout')finishLayout(false);else if(menuKind==='settings')settingsBack();else if(p&&mode!=='title')resume()}return}
 const actions=actionsFor(e.code);if(!actions.length&&e.code!=='Escape')return;e.preventDefault();if(e.repeat||keyHeld.has(e.code))return;audioEngine.unlock();if(e.code==='Escape'||actions.includes('pause')){pause();return}if(actions.includes('journal')){journal();return}keyHeld.add(e.code);for(const action of actions)press(action);
});
window.addEventListener('keyup',e=>{keyHeld.delete(e.code);for(const a of actionsFor(e.code))release(a)});
window.addEventListener('blur',()=>{resetInput();if(mode==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){resetInput();if(mode==='play')pause();if(audioEngine.ctx)audioEngine.ctx.suspend().catch(()=>{})}});
window.addEventListener('contextmenu',e=>{if(e.target.closest('#controls'))e.preventDefault()});
$('pause').onclick=()=>{audioEngine.unlock();pause()};$('journal').onclick=()=>{audioEngine.unlock();journal()};$('use').onclick=()=>{if(mode==='play'){audioEngine.unlock();interact()}};
$('full').onclick=()=>{audioEngine.unlock();const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>toast('Tela cheia indisponível neste navegador.'));else if(document.exitFullscreen&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})};
$('layoutsave').onclick=()=>finishLayout(true);$('layoutcancel').onclick=()=>finishLayout(false);$('layoutreset').onclick=()=>{settings.layouts[orientation()]={};layoutControls()};
function resize(){const box=$('view'),w=box.clientWidth||960,h=box.clientHeight||540,d=Math.min(2,devicePixelRatio||1);c.width=Math.round(w*d);c.height=Math.round(h*d);scale=Math.min(h/540,w/580);view=w/scale;offsetY=Math.max(0,h-540*scale);layoutControls();resetInput()}

function hud(){if(!p){$('hud').hidden=true;$('bossbar').hidden=true;$('area-title').style.opacity='0';return}$('hud').hidden=false;$('health').textContent='◆'.repeat(Math.max(0,p.hp))+'◇'.repeat(Math.max(0,data.life-p.hp));$('stats').textContent=roomInfo().name+' · '+data.coins+' lúmens';$('manafill').style.width=(p.mana/currentMaxMana()*100)+'%';$('manatext').textContent=Math.floor(p.mana)+' / '+currentMaxMana()+' ECOS';

let uiTime=0;
function frame(now){const dt=Math.min(.08,Math.max(0,(now-last)/1000||0));last=now;clock+=dt;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}if(mode==='play')areaTime=Math.max(0,areaTime-dt);toastTime=Math.max(0,toastTime-dt);$('toast').style.opacity=toastTime>0?'1':'0';uiTime+=dt;if(uiTime>.10){hud();uiTime=0}audioEngine.tick();draw();requestAnimationFrame(frame)}
